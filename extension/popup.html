<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ferro · Connect a tab</title>
<link rel="stylesheet" href="sidepanel.css"><link rel="stylesheet" href="popup.css">
<script src="popup.js" defer></script>
</head>
<body class="pairing-popup">
<header><span class="brand-mark" aria-hidden="true"><img src="icons/ferro-mark.svg" alt=""></span><strong>Ferro</strong><span class="header-note">Your browser, a little lighter.</span></header>
<main class="pairing-card" aria-labelledby="pairing-title">
  <h1 id="pairing-title">A little help with this tab.</h1>
  <p class="intro">Connect the page in front of you, then pick up the conversation.</p>
  <div class="connection-fields">
    <label for="base">Local service</label>
    <input id="base" type="url" value="http://127.0.0.1:4175" placeholder="http://127.0.0.1:4175" spellcheck="false" autocomplete="off">
    <label for="token">Pairing token</label>
    <input id="token" type="password" autocomplete="off" placeholder="Paste your pairing token" aria-describedby="token-hint">
    <p id="token-hint" class="hint">Enter it once. Ferro reuses it when you switch tabs during this Chrome session.</p>
  </div>
  <div class="pairing-actions">
    <button id="open-chat" class="primary" type="button" hidden>Open chat <span aria-hidden="true">↗</span></button>
    <button id="connection-toggle" type="button" disabled>Checking connection…</button>
  </div>
  <p id="status" role="status" aria-live="polite">Checking connection…</p>
</main>
<footer>Only the tab you connect is shared with Ferro.</footer>
</body>
</html>
